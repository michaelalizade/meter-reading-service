services:
  postgres:
    image: postgres:16-alpine
    container_name: meter-reading-db
    environment:
      POSTGRES_DB: meterreading
      POSTGRES_USER: meteruser
      POSTGRES_PASSWORD: meterpass
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    networks:
      - meter-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U meteruser -d meterreading"]
      interval: 10s
      timeout: 5s
      retries: 5

  keycloak:
    image: quay.io/keycloak/keycloak:23.0
    container_name: meter-reading-keycloak
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: meteruser
      KC_DB_PASSWORD: meterpass
      KC_HOSTNAME_STRICT: false
      KC_HTTP_ENABLED: true
      KC_HEALTH_ENABLED: true
    ports:
      - "8082:8080"
    depends_on:
      postgres:
        condition: service_healthy
    command:
      - start-dev
      - --import-realm
    volumes:
      - ./keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json
    networks:
      - meter-network
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/8080;echo -e 'GET /health/ready HTTP/1.1\r\nhost: http://localhost\r\nConnection: close\r\n\r\n' >&3;grep 'HTTP/1.1 200 OK' <&3"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: meter-reading-app
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/meterreading
      SPRING_DATASOURCE_USERNAME: meteruser
      SPRING_DATASOURCE_PASSWORD: meterpass
      KEYCLOAK_URL: http://keycloak:8080
      KEYCLOAK_REALM: meter-reading
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    networks:
      - meter-network
    restart: on-failure

networks:
  meter-network:
    driver: bridge

volumes:
  postgres_data: